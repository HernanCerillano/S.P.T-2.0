spring:
  application:
    name: SPT

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/spt_taller?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

server:
  port: ${PORT:8080}

# Orígenes permitidos por CORS, separados por coma.
# Incluye Tauri (tauri://localhost en macOS/Linux, https://tauri.localhost en Windows).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:1420,tauri://localhost,http://tauri.localhost,https://tauri.localhost}

whatsapp:
  provider: ${WHATSAPP_PROVIDER:noop}   # noop | twilio
  scheduler-delay-ms: ${WHATSAPP_SCHEDULER_DELAY_MS:60000}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
    content-sid: ${TWILIO_CONTENT_SID:HXb5b62575e6e4ff6129ad7c8efe1f983e}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.SPT: ${LOG_LEVEL_APP:INFO}
